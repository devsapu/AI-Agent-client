<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" font-family="Calibri, Arial, sans-serif">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5B6B79"/>
      </marker>
      <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#0E7C7B"/>
      </marker>
    </defs>
    <rect x="0" y="0" width="1180" height="460" fill="#FFFFFF"/><rect x="20.0" y="30" width="357.3333333333333" height="380" rx="12" fill="#F7F9FB" stroke="#DCE4E9" stroke-width="2"/><circle cx="54.0" cy="64" r="18" fill="#0E7C7B"/><text x="54.0" y="70" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="84.0" y="70" font-size="16.5" font-weight="700" fill="#1A2430" text-anchor="start"><tspan x="84.0" dy="0">AI calls over BYO-SIP</tspan></text><text x="54.0" y="110" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="54.0" dy="0">• Voice platform places the call via</tspan><tspan x="54.0" dy="16">  PFEC's SIP trunk (local BD/AU caller ID)</tspan></text><text x="54.0" y="150" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="54.0" dy="0">• Runs STT -> LLM -> TTS loop using the</tspan><tspan x="54.0" dy="16">  selected script</tspan></text><text x="54.0" y="190" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="54.0" dy="0">• Phase 2: mid-call function-calling</tspan><tspan x="54.0" dy="16">  checks availability / books live</tspan></text><line x1="377.3333333333333" y1="220.0" x2="411.3333333333333" y2="220.0" stroke="#0E7C7B" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="411.3333333333333" y="30" width="357.3333333333333" height="380" rx="12" fill="#F7F9FB" stroke="#DCE4E9" stroke-width="2"/><circle cx="445.3333333333333" cy="64" r="18" fill="#0E7C7B"/><text x="445.3333333333333" y="70" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="475.3333333333333" y="70" font-size="16.5" font-weight="700" fill="#1A2430" text-anchor="start"><tspan x="475.3333333333333" dy="0">End-of-call webhook</tspan><tspan x="475.3333333333333" dy="20">returns</tspan></text><text x="445.3333333333333" y="130" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="445.3333333333333" dy="0">• Voice platform POSTs the result to the</tspan><tspan x="445.3333333333333" dy="16">  middleware's webhook receiver</tspan></text><text x="445.3333333333333" y="170" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="445.3333333333333" dy="0">• Payload: {leadId, outcome, transcript,</tspan><tspan x="445.3333333333333" dy="16">  summary, capturedFields, recordingUrl,</tspan><tspan x="445.3333333333333" dy="16">  duration}</tspan></text><text x="445.3333333333333" y="226" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="445.3333333333333" dy="0">• leadId round-trips so the result matches</tspan><tspan x="445.3333333333333" dy="16">  the right CRM record</tspan></text><line x1="768.6666666666666" y1="220.0" x2="802.6666666666666" y2="220.0" stroke="#0E7C7B" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="802.6666666666666" y="30" width="357.3333333333333" height="380" rx="12" fill="#F7F9FB" stroke="#DCE4E9" stroke-width="2"/><circle cx="836.6666666666666" cy="64" r="18" fill="#0E7C7B"/><text x="836.6666666666666" y="70" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="866.6666666666666" y="70" font-size="16.5" font-weight="700" fill="#1A2430" text-anchor="start"><tspan x="866.6666666666666" dy="0">Zoho CRM stage updated</tspan></text><text x="836.6666666666666" y="110" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="836.6666666666666" dy="0">• Middleware maps the outcome to a stage</tspan><tspan x="836.6666666666666" dy="16">  per BR-01–BR-10</tspan></text><text x="836.6666666666666" y="150" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="836.6666666666666" dy="0">• Writes via Zoho CRM REST API: Lead</tspan><tspan x="836.6666666666666" dy="16">  Stage, attempt #, timestamps, summary,</tspan><tspan x="836.6666666666666" dy="16">  appointment/DQ reason</tspan></text><text x="836.6666666666666" y="206" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="836.6666666666666" dy="0">• Zoho's own workflow rules then fire</tspan><tspan x="836.6666666666666" dy="16">  Email/WhatsApp downstream</tspan></text></svg>
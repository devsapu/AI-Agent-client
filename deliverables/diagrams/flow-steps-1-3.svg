    <rect x="0" y="0" width="1180" height="460" fill="#FFFFFF"/><rect x="20.0" y="30" width="357.3333333333333" height="380" rx="12" fill="#F7F9FB" stroke="#DCE4E9" stroke-width="2"/><circle cx="54.0" cy="64" r="18" fill="#0E7C7B"/><text x="54.0" y="70" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="84.0" y="70" font-size="16.5" font-weight="700" fill="#1A2430" text-anchor="start"><tspan x="84.0" dy="0">Lead eligible in Zoho</tspan><tspan x="84.0" dy="20">CRM</tspan></text><text x="54.0" y="130" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="54.0" dy="0">• Lead Stage set to Not Yet Contacted</tspan></text><text x="54.0" y="154" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="54.0" dy="0">• Fields populated: campaign, UTM</tspan><tspan x="54.0" dy="16">  source/medium/campaign/content,</tspan><tspan x="54.0" dy="16">  destination, branch, enquiry type</tspan></text><text x="54.0" y="210" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="54.0" dy="0">• Record now matches BRD 7.1 read-context</tspan><tspan x="54.0" dy="16">  requirements</tspan></text><line x1="377.3333333333333" y1="220.0" x2="411.3333333333333" y2="220.0" stroke="#0E7C7B" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="411.3333333333333" y="30" width="357.3333333333333" height="380" rx="12" fill="#F7F9FB" stroke="#DCE4E9" stroke-width="2"/><circle cx="445.3333333333333" cy="64" r="18" fill="#0E7C7B"/><text x="445.3333333333333" y="70" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="475.3333333333333" y="70" font-size="16.5" font-weight="700" fill="#1A2430" text-anchor="start"><tspan x="475.3333333333333" dy="0">Native Zoho webhook</tspan><tspan x="475.3333333333333" dy="20">fires</tspan></text><text x="445.3333333333333" y="130" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="445.3333333333333" dy="0">• Workflow Rule triggers on the</tspan><tspan x="445.3333333333333" dy="16">  stage/field update, no Zapier anywhere</tspan></text><text x="445.3333333333333" y="170" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="445.3333333333333" dy="0">• Instant Webhook (or Deluge function)</tspan><tspan x="445.3333333333333" dy="16">  POSTs Lead ID + context fields to the</tspan><tspan x="445.3333333333333" dy="16">  middleware URL</tspan></text><text x="445.3333333333333" y="226" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="445.3333333333333" dy="0">• Payload: {leadId, phone, campaign, utm*,</tspan><tspan x="445.3333333333333" dy="16">  destination, branch, enquiryType,</tspan><tspan x="445.3333333333333" dy="16">  regionType}</tspan></text><line x1="768.6666666666666" y1="220.0" x2="802.6666666666666" y2="220.0" stroke="#0E7C7B" stroke-width="2.5" marker-end="url(#arrowTeal)"/><rect x="802.6666666666666" y="30" width="357.3333333333333" height="380" rx="12" fill="#F7F9FB" stroke="#DCE4E9" stroke-width="2"/><circle cx="836.6666666666666" cy="64" r="18" fill="#0E7C7B"/><text x="836.6666666666666" y="70" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="866.6666666666666" y="70" font-size="16.5" font-weight="700" fill="#1A2430" text-anchor="start"><tspan x="866.6666666666666" dy="0">Middleware triggers the</tspan><tspan x="866.6666666666666" dy="20">call</tspan></text><text x="836.6666666666666" y="130" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="836.6666666666666" dy="0">• Middleware parses campaign/UTM to select</tspan><tspan x="836.6666666666666" dy="16">  Offshore vs Onshore, Education vs</tspan><tspan x="836.6666666666666" dy="16">  Migration script</tspan></text><text x="836.6666666666666" y="186" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="836.6666666666666" dy="0">• Calls the voice platform's Create</tspan><tspan x="836.6666666666666" dy="16">  Outbound Call API</tspan></text><text x="836.6666666666666" y="226" font-size="12" fill="#5B6B79" text-anchor="start"><tspan x="836.6666666666666" dy="0">• Request: {phone, leadId, assistantId,</tspan><tspan x="836.6666666666666" dy="16">  contextVars}</tspan></text></svg>